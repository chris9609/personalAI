services:
  server:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # エージェントの道具はmcpo(Docker内線)経由で呼ぶ
      - MCPO_BASE_URL=http://mcpo:8600
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./secrets:/app/secrets:ro
      # 夜間バッチ(ホスト側)が更新したRAGデータをそのまま読む。
      # ChromaDBはsqlite書き込みがあるためro指定はしない
      - ./chroma_db:/app/chroma_db
    restart: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_BASE_URL=http://server:8000/v1
      - OPENAI_API_KEY=dummy
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - server
    restart: always

  # MCPサーバー(personal-mcp)をOpen WebUIから使うための変換アダプタ。
  # ポートを公開していないので、届くのはDocker内部のopen-webuiからだけ
  # (URL: http://mcpo:8600)。外の世界やTailscaleからは直接触れない。
  mcpo:
    build:
      context: ../MCP
      dockerfile: Dockerfile.mcpo
    command: mcpo --host 0.0.0.0 --port 8600 -- node /mcp/build/index.js
    environment:
      # 小型モデル(gemma)が迷わないよう、まずはカレンダー2ツールだけ見せる。
      # 武器を増やすときはここを "gcal,anki" のように編集して再起動
      - TOOLS=gcal
    volumes:
      - ../MCP:/mcp:ro
      # コードは homedir 基準でトークンを探すので、コンテナ内ホーム(/root)配下の
      # 同じ相対位置にsecretsを見せる（Mac側と地図を合わせる）
      - ./secrets:/root/claude/application/personalAI/secrets:ro
    restart: always

volumes:
  open-webui:
